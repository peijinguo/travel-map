name: Sync Sapporo Kokusai lift status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-kokusai-lift-status
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch official lift status
        run: node scripts/sync-kokusai-lift-status.mjs

      - name: Commit updated status
        run: |
          if git diff --quiet -- src/data/kokusaiLiftStatus.js; then
            echo "Official status has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/kokusaiLiftStatus.js
          git commit -m "chore: sync Sapporo Kokusai lift status"
          git push
