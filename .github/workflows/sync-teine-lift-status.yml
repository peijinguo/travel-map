name: Sync ski resort live status

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-ski-resort-status
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch official status
        run: |
          node scripts/sync-teine-lift-status.mjs
          node scripts/sync-bankei-status.mjs

      - name: Detect status changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- src/data/teineLiftStatus.js src/data/bankeiStatus.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Official status has not changed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated status
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/teineLiftStatus.js src/data/bankeiStatus.js
          git commit -m "chore: sync ski resort live status"
          git push

      # The site reads its Google Maps and Firebase settings at build time.
      # They live in repository secrets; without them the published site
      # loses the map and cloud sync, so skip publishing instead.
      - name: Check build settings
        id: build-env
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: |
          if [ -z "$VITE_GOOGLE_MAPS_API_KEY" ] || [ -z "$VITE_FIREBASE_API_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Repository secrets for Google Maps / Firebase are missing; skipped publishing the website."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build updated website
        if: steps.changes.outputs.changed == 'true' && steps.build-env.outputs.ready == 'true'
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npx vite build

      - name: Publish updated website
        if: steps.changes.outputs.changed == 'true' && steps.build-env.outputs.ready == 'true'
        run: npx gh-pages -d dist -u "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
